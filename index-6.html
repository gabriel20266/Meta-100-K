<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#063B2F">
<title>Meta 100K</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
:root{--g:#063B2F;--g2:#0C5A46;--gold:#F2B705;--bg:#F4F7F5;--c:#fff;--t:#10261F;--m:#5E7269;--r:#C8433B}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--t);min-height:100vh}
header{background:var(--g);color:#fff;padding:calc(env(safe-area-inset-top) + 18px) 18px 22px}
header h1{font-size:1.5rem;color:var(--gold)}header p{color:#b9d3c9;font-size:.9rem;margin-top:2px}
#app{padding:16px 16px 12px;max-width:560px;margin:auto}
.card{background:var(--c);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px #0001}
h2{font-size:1.1rem;margin-bottom:8px}
.mut{color:var(--m);font-size:.9rem}
.bar{height:14px;background:#DDE7E2;border-radius:9px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g2),var(--gold));border-radius:9px;transition:width .4s}
.big{font-size:1.5rem;font-weight:800}
button{border:0;border-radius:12px;padding:14px;font-size:1rem;font-weight:700;cursor:pointer;width:100%}
.pri{background:var(--gold);color:var(--g)}.sec{background:#E3ECE8;color:var(--g);margin-top:8px}.zero{background:none;color:var(--r);margin-top:6px}
.zap{background:#25D366;color:#fff;margin-top:8px}
input{width:100%;padding:14px;border:2px solid #CBD9D2;border-radius:12px;font-size:1rem;margin:6px 0 10px;background:#fff}
input:focus{outline:3px solid var(--gold);border-color:var(--gold)}
label{font-size:.85rem;color:var(--m);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.chip{width:auto;padding:10px 14px;background:#E3ECE8;color:var(--g);font-size:.9rem}.chip.on{background:var(--g);color:#fff}
.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #E6EEEA}.row:last-child{border:0}
.row b{color:var(--g)}
.dep{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #E6EEEA;font-size:.95rem}
.dep button{width:auto;background:none;color:var(--m);padding:4px 10px}
.msg{background:#FFF6D6;border-radius:12px;padding:12px;font-weight:600;margin-bottom:12px}
.fire{background:var(--g);color:#fff;border-radius:16px;padding:14px;margin-bottom:12px}
.back{background:none;color:var(--g);width:auto;padding:0 0 10px;font-size:.95rem}
.slot{min-height:50px;text-align:center}
#intro{position:fixed;inset:0;z-index:20;background:radial-gradient(circle at 50% 30%,#0C5A46,#063B2F 70%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;transition:opacity .5s,transform .5s}
#intro.sai{opacity:0;transform:scale(1.06);pointer-events:none}
.anel{position:relative;width:150px;height:150px}
.anel svg{position:absolute;inset:0;transform:rotate(-90deg)}
.anel circle{fill:none;stroke-width:6;stroke-linecap:round}
.anel .f{stroke:#ffffff22}.anel .p{stroke:var(--gold);stroke-dasharray:408;stroke-dashoffset:408;animation:traco 1.9s .2s ease-out forwards}
@keyframes traco{to{stroke-dashoffset:0}}
.anel b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:2.1rem;color:var(--gold);animation:pop2 .6s .4s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop2{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}
@keyframes sobe{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.it{font-size:2rem;font-weight:800;margin-top:22px;animation:sobe .6s .9s both}
.icont{font-size:2.3rem;font-weight:800;color:var(--gold);margin-top:10px;animation:sobe .6s 1.1s both}
.ib{width:min(70%,260px);height:8px;background:#ffffff22;border-radius:9px;overflow:hidden;margin-top:12px;animation:sobe .6s 1.1s both}
.ib i{display:block;height:100%;width:0;background:linear-gradient(90deg,#1E9E6A,var(--gold));border-radius:9px;animation:enche 2s 1.2s ease-out forwards}
@keyframes enche{to{width:100%}}
.frases{margin-top:24px;font-size:1.1rem;font-weight:600;line-height:1.7}
.frases span{display:block;opacity:0;animation:sobe .5s both}
.frases span:nth-child(1){animation-delay:1.6s}.frases span:nth-child(2){animation-delay:2s}.frases span:nth-child(3){animation-delay:2.4s;color:var(--gold)}
.sub{color:#b9d3c9;font-size:.9rem;margin-top:14px;animation:sobe .6s 2.8s both}
.toque{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 22px);font-size:.8rem;color:#ffffff99;animation:sobe .6s 3s both,piscar 1.6s 3.6s infinite}
@keyframes piscar{50%{opacity:.35}}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
#nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #dde6e1;display:flex;z-index:4;padding-bottom:env(safe-area-inset-bottom)}
#nav button{flex:1;background:none;color:var(--m);border-radius:0;padding:9px 4px;font-size:.72rem;font-weight:600}
#nav button span{display:block;font-size:1.25rem}#nav button.on{color:var(--g)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal b{font-size:.72rem;color:var(--m);padding:4px 0}
.d{width:100%;aspect-ratio:1;padding:0;background:#fff;color:var(--t);border-radius:10px;font-size:.9rem;font-weight:600;position:relative}
.d.tem{background:#DFF3EA}.d.hoje{outline:2px solid var(--gold)}.d.sel{background:var(--g);color:#fff}.d.vz{visibility:hidden}
.d i{position:absolute;bottom:4px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--r)}
.mes{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mes button{width:44px;padding:8px;background:#E3ECE8;color:var(--g)}.mes b{font-size:1.05rem}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi div{background:#fff;border-radius:14px;padding:14px;box-shadow:0 1px 3px #0001}.kpi b{display:block;font-size:1.15rem;color:var(--g)}.kpi span{font-size:.8rem;color:var(--m)}
textarea{width:100%;min-height:140px;padding:12px;border:2px solid #CBD9D2;border-radius:12px;font-size:.85rem;margin:6px 0 10px}
.dica{background:#FFF6D6;border-radius:14px;padding:14px;margin-bottom:12px;line-height:1.5}
button:active{transform:scale(.97)}
.card{animation:subir .35s ease both}@keyframes subir{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ov{position:fixed;inset:0;background:rgba(15,23,20,.5);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:10;animation:fade .2s ease}
.ov.sai{opacity:0;transition:opacity .2s}@keyframes fade{from{opacity:0}to{opacity:1}}
.mod{position:relative;overflow:hidden;background:#fff;border-radius:20px;padding:28px 22px 20px;width:min(90%,350px);text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.3);animation:entra .3s cubic-bezier(.2,.9,.3,1) both}
.ov.sai .mod{transform:translateY(10px) scale(.97);transition:transform .2s}
@keyframes entra{from{opacity:0;transform:translateY(26px) scale(.96)}to{opacity:1;transform:none}}
.ic{width:76px;height:76px;margin:0 auto;border-radius:50%}
.ic svg{width:76px;height:76px;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.ic .c{stroke-dasharray:150;stroke-dashoffset:150;animation:traco2 .55s ease-out forwards}
.ic .k{stroke-dasharray:60;stroke-dashoffset:60;animation:traco2 .4s .35s ease-out forwards}
@keyframes traco2{to{stroke-dashoffset:0}}
.sucesso .ic{background:#E8F7EE}.sucesso svg{stroke:#16A34A}
.erro .ic{background:#FDECEC}.erro svg{stroke:#DC2626}
.confirmar .ic{background:#FFF4D6}.confirmar svg{stroke:#D99A00}
.mod h3{font-size:1.2rem;color:#10261F;margin:16px 0 6px}
.mod p{line-height:1.5}
.mb{display:flex;gap:10px}.mb button{margin-top:18px;padding:13px}
.sucesso .pri{background:#16A34A;color:#fff}.erro .pri{background:#DC2626;color:#fff}
.zero2{background:#DC2626;color:#fff}
.spin{width:58px;height:58px;margin:0 auto;border:5px solid #E3ECE8;border-top-color:var(--g2);border-radius:50%;animation:gira2 .8s linear infinite}
@keyframes gira2{to{transform:rotate(360deg)}}
.tempo{position:absolute;left:0;bottom:0;height:4px;width:100%;background:#16A34A;transform-origin:left;animation:esgota 3s linear forwards}
@keyframes esgota{to{transform:scaleX(0)}}
.cf{position:fixed;top:-20px;width:10px;height:14px;z-index:11;animation:cai linear forwards}
@keyframes cai{to{transform:translateY(110vh) rotate(540deg)}}
#aviso{display:none;position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 76px);background:var(--gold);color:var(--g);padding:12px;border-radius:14px;align-items:center;justify-content:space-between;gap:10px;font-weight:700;z-index:5}
#aviso button{width:auto;padding:10px 14px;background:var(--g);color:#fff}
</style>
</head>
<body>
<div id="intro"><div class="anel"><svg viewBox="0 0 150 150"><circle class="f" cx="75" cy="75" r="65"/><circle class="p" cx="75" cy="75" r="65"/></svg><b>100K</b></div>
<div class="it">Meta 100K</div><div class="icont" id="icont">0 Kz</div><div class="ib"><i></i></div>
<div class="frases"><span>Defina a meta.</span><span>Guarde todo dia.</span><span>Chegue lá.</span></div>
<div class="sub">Cada Kz guardado aproxima você do seu sonho.</div><div class="toque">Toque para começar</div></div>
<header><h1>Meta 100K</h1><p>Quanto falta para realizar o seu objetivo?</p></header>
<div id="app"></div>
<nav id="nav"><button onclick="lista()"><span>🎯</span>Metas</button><button onclick="calendario()"><span>📅</span>Calendário</button><button onclick="relatorio()"><span>📊</span>Relatório</button><button onclick="definicoes()"><span>⚙️</span>Definições</button></nav>
<div id="aviso"><span>Nova versão disponível</span><button id="atualizar">Atualizar</button></div>
<script>
const VERSAO='1.8',app=document.getElementById('app');
let metas=[];try{metas=JSON.parse(localStorage.getItem('metas100k')||'[]')}catch(e){}
let atual=null;
const salvar=()=>{try{localStorage.setItem('metas100k',JSON.stringify(metas))}catch(e){}};
const kz=n=>Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.')+' Kz';
const iso=d=>{const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)};
const hoje=()=>iso(new Date());
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e};
const guardado=m=>m.inicial+m.dep.reduce((s,d)=>s+d.v,0);
const dias=m=>Math.max(0,Math.ceil((new Date(m.prazo+'T00:00')-new Date(hoje()+'T00:00'))/864e5));
const porDia=(v,f)=>f==='diario'?v:f==='semanal'?v/7:v/30;
const nomeFreq={diario:'por dia',semanal:'por semana',mensal:'por mês'};
const tempo=n=>n+(n===1?' dia':' dias')+' (≈ '+Math.ceil(n/7)+(Math.ceil(n/7)===1?' semana':' semanas')+' ou ≈ '+(n/30).toFixed(1).replace('.',',')+' meses)';
const dataPrev=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d).split('-').reverse().join('/')};
const pct=m=>Math.min(100,Math.round(guardado(m)/m.alvo*100));
function sequencia(m){
  const ds=new Set(m.dep.map(d=>d.d));let n=0,d=new Date();
  if(!ds.has(iso(d)))d.setDate(d.getDate()-1);
  while(ds.has(iso(d))){n++;d.setDate(d.getDate()-1)}return n;
}
function mensagem(p){
  if(p>=100)return 'Meta alcançada! Parabéns, você conseguiu!';
  if(p>=75)return 'Falta pouco! Você está na reta final.';
  if(p>=50)return 'Já passou da metade. Continue assim!';
  if(p>=25)return 'Bom ritmo! Cada depósito conta.';
  if(p>0)return 'Ótimo começo! O primeiro passo já foi dado.';
  return 'Comece hoje. Até um pequeno valor já ajuda.';
}
function barra(m){const b=el('div','bar'),i=el('i');i.style.width='0%';b.append(i);requestAnimationFrame(()=>requestAnimationFrame(()=>{i.style.width=pct(m)+'%'}));return b}
function modal(o){return new Promise(res=>{
  const ov=el('div','ov'),bx=el('div','mod '+o.tipo),bt=el('div','mb'),ic=el('div','ic');
  const P={sucesso:'<path class="k" d="M16 27l7 7 14-15"/>',erro:'<path class="k" d="M18 18l16 16M34 18L18 34"/>',confirmar:'<path class="k" d="M26 15v14M26 36v.5"/>'}[o.tipo];
  ic.innerHTML='<svg viewBox="0 0 52 52"><circle class="c" cx="26" cy="26" r="23"/>'+P+'</svg>';
  bx.append(ic,el('h3','',o.titulo),el('p','mut',o.texto||''));
  let t;const fecha=v=>{clearTimeout(t);ov.classList.add('sai');setTimeout(()=>{ov.remove();res(v)},200)};
  if(o.tipo==='confirmar'){const c=el('button','sec','Cancelar');c.onclick=()=>fecha(false);bt.append(c)}
  const ok=el('button',o.tipo==='confirmar'?'zero2':'pri',o.ok||(o.tipo==='erro'?'Fechar':'OK'));ok.onclick=()=>fecha(true);bt.append(ok);
  bx.append(bt);
  if(o.tipo==='sucesso'&&!o.fixo){bx.append(el('div','tempo'));t=setTimeout(()=>fecha(true),3000)}
  ov.append(bx);ov.onclick=e=>{if(e.target===ov)fecha(false)};document.body.append(ov);
  try{navigator.vibrate&&navigator.vibrate(o.tipo==='erro'?[60,40,60]:30)}catch(e){}
})}
function processar(txt){return new Promise(res=>{
  const ov=el('div','ov'),bx=el('div','mod');
  bx.append(el('div','spin'),el('h3','',txt||'Processando...'),el('p','mut','Aguarde um momento'));
  ov.append(bx);document.body.append(ov);
  setTimeout(()=>{ov.remove();res()},3000);
})}
function confete(){const cor=['#F2B705','#1E9E6A','#0C5A46','#C8433B','#fff'];
  for(let i=0;i<40;i++){const c=el('span','cf');c.style.left=Math.random()*100+'vw';c.style.background=cor[i%5];
    c.style.animationDuration=(1.6+Math.random()*1.6)+'s';c.style.animationDelay=Math.random()*.4+'s';document.body.append(c);setTimeout(()=>c.remove(),3800)}}
function tela(i){app.innerHTML='';window.scrollTo(0,0);document.querySelectorAll('#nav button').forEach((b,n)=>b.classList.toggle('on',n===i))}
const DICAS=['Guarde primeiro, gaste depois: separe o valor da meta assim que receber.','Pequenos valores todos os dias vencem grandes valores raros.','Anote seus gastos por uma semana. Você vai descobrir dinheiro escondido.','Meta sem prazo vira sonho. Defina uma data.','Antes de comprar por impulso, espere 24 horas.','Tenha uma reserva de emergência antes de outras metas.','Comemore cada 25% da meta alcançada.','Conte a alguém sobre a sua meta. Isso ajuda a manter o compromisso.','Venda o que não usa e coloque o valor na meta.','Compare preços antes de comprar. A diferença vai para a sua meta.','Guarde o troco e as notas pequenas num lugar separado.','Revise a meta uma vez por semana e ajuste se precisar.'];
let cfg={notif:false};try{cfg=Object.assign(cfg,JSON.parse(localStorage.getItem('cfg100k')||'{}'))}catch(e){}
const salvarCfg=()=>{try{localStorage.setItem('cfg100k',JSON.stringify(cfg))}catch(e){}};
function notificar(t,c){
  if(!cfg.notif||!('Notification' in window)||Notification.permission!=='granted')return;
  try{navigator.serviceWorker.getRegistration().then(r=>{if(r)r.showNotification(t,{body:c,icon:'icon-192.png'});else new Notification(t,{body:c,icon:'icon-192.png'})})}catch(e){}
}
function lista(){
  atual=null;tela(0);
  if(metas.length){
    const tot=metas.reduce((s,m)=>s+guardado(m),0),c=el('div','card');
    c.append(el('div','mut','Total guardado'),el('div','big',kz(tot)),el('div','mut',metas.length+(metas.length===1?' meta':' metas')));
    app.append(c);
    if(!metas.some(m=>m.dep.some(d=>d.d===hoje())))app.append(el('div','msg','Você ainda não guardou hoje. Que tal adicionar um valor?'));
  }else app.append(Object.assign(el('div','card'),{innerHTML:'<h2>Bem-vindo!</h2><p class="mut">Crie a sua primeira meta e veja quanto precisa guardar por dia, semana e mês.</p>'}));
  metas.forEach(m=>{
    const c=el('div','card');c.style.cursor='pointer';
    c.append(el('h2','',m.nome),barra(m),el('div','mut',kz(guardado(m))+' / '+kz(m.alvo)+' · '+pct(m)+'%'));
    c.onclick=()=>detalhe(m.id);app.append(c);
  });
  const b=el('button','pri','＋ Nova meta');b.onclick=()=>nova();app.append(b);
  const dc=el('div','dica');dc.style.marginTop='14px';
  dc.append(el('b','','💡 Dica do dia'),el('div','',DICAS[Math.floor(Date.now()/864e5)%DICAS.length]));app.append(dc);
}
function nova(ed){
  tela(0);const f=el('div','card');let modo=ed&&ed.plano?'quantia':'prazo',freq=ed&&ed.plano?ed.plano.freq:'semanal';
  f.append(el('h2','',ed?'Editar meta':'Nova meta'));
  f.append(el('label','','Nome da meta'));const nome=el('input');nome.placeholder='Ex: Comprar telefone';if(ed)nome.value=ed.nome;f.append(nome);
  f.append(el('label','','Minha meta'));
  const ch=el('div','chips'),av=el('input');av.type='number';av.inputMode='numeric';av.value=ed?ed.alvo:100000;
  [50000,100000,500000,1000000].forEach(v=>{const c=el('button','chip',kz(v));c.onclick=()=>{av.value=v;mark();prev()};ch.append(c)});
  const outro=el('button','chip','Outro valor');outro.onclick=()=>{av.value='';av.focus();mark();prev()};ch.append(outro);
  const mark=()=>[...ch.children].forEach(c=>c.classList.toggle('on',c.textContent===kz(+av.value)));
  av.oninput=()=>{mark();prev()};f.append(ch,av);mark();
  f.append(el('label','','Quanto já tenho (Kz)'));const ini=el('input');ini.type='number';ini.inputMode='numeric';ini.value=ed?ed.inicial:0;ini.oninput=()=>prev();f.append(ini);
  f.append(el('label','','Como quer planear?'));
  const mc=el('div','chips'),m1=el('button','chip on','Tenho um prazo'),m2=el('button','chip','Tenho uma quantia');
  mc.append(m1,m2);f.append(mc);
  const bp=el('div'),bq=el('div');bq.style.display='none';
  bp.append(el('label','','Prazo (em dias)'));const pz=el('input');pz.type='number';pz.inputMode='numeric';pz.value=ed?Math.max(1,dias(ed)):60;bp.append(pz);
  bq.append(el('label','','Quanto consigo guardar (Kz)'));const qv=el('input');qv.type='number';qv.inputMode='numeric';qv.placeholder='Ex: 5000';if(ed&&ed.plano)qv.value=ed.plano.v;qv.oninput=()=>prev();bq.append(qv);
  const fc=el('div','chips');
  [['diario','Por dia'],['semanal','Por semana'],['mensal','Por mês']].forEach(([k,t])=>{
    const c=el('button','chip'+(k===freq?' on':''),t);c.onclick=()=>{freq=k;[...fc.children].forEach(x=>x.classList.toggle('on',x===c));prev()};fc.append(c)});
  bq.append(fc);const pv=el('div','msg','');pv.style.display='none';bq.append(pv);
  f.append(bp,bq);
  function prev(){
    const falta=+av.value-(+ini.value||0),v=+qv.value;
    if(modo==='quantia'&&v>0&&falta>0){const n=Math.ceil(falta/porDia(v,freq));pv.style.display='block';pv.textContent='Guardando '+kz(v)+' '+nomeFreq[freq]+', você chega lá em '+tempo(n)+'.'}
    else pv.style.display='none';
  }
  const setModo=x=>{modo=x;m1.classList.toggle('on',x==='prazo');m2.classList.toggle('on',x==='quantia');bp.style.display=x==='prazo'?'block':'none';bq.style.display=x==='quantia'?'block':'none';prev()};
  m1.onclick=()=>setModo('prazo');m2.onclick=()=>setModo('quantia');if(modo==='quantia')setModo('quantia');
  const ok=el('button','pri',ed?'Salvar alterações':'Criar meta');
  ok.onclick=async()=>{
    const a=+av.value,i=+ini.value||0;
    if(!nome.value.trim()||!(a>0)||i<0||i>=a){await modal({tipo:'erro',titulo:'Falha ao criar meta',texto:'Preencha o nome e uma meta maior que o valor inicial.'});return}
    const m=ed?JSON.parse(JSON.stringify(ed)):{id:Date.now(),criada:hoje(),dep:[]};m.nome=nome.value.trim();m.alvo=a;m.inicial=i;
    let n;
    if(modo==='quantia'){const v=+qv.value;if(!(v>0)){await modal({tipo:'erro',titulo:'Falha ao criar meta',texto:'Digite quanto consegue guardar.'});return}
      m.plano={v,freq};n=Math.ceil((a-i)/porDia(v,freq))}
    else{n=Math.floor(+pz.value);if(!(n>0)){await modal({tipo:'erro',titulo:'Falha ao criar meta',texto:'Digite o prazo em dias.'});return}delete m.plano}
    const d=new Date();d.setDate(d.getDate()+n);m.prazo=iso(d);
    await processar(ed?'Guardando alterações...':'Criando meta...');if(ed){delete ed.plano;Object.assign(ed,m)}else metas.push(m);salvar();detalhe(m.id);modal(ed?{tipo:'sucesso',titulo:'Meta atualizada!',texto:'As alterações foram guardadas e o histórico foi mantido.'}:{tipo:'sucesso',titulo:'Meta criada!',texto:'"'+m.nome+'" já está pronta. Comece a guardar!'});
  };
  const v=el('button','sec','Voltar');v.onclick=ed?()=>detalhe(ed.id):lista;f.append(ok,v);app.append(f);
}
function detalhe(id){
  const m=metas.find(x=>x.id===id);if(!m)return lista();atual=id;tela(0);
  const vb=el('button','back','‹ Minhas metas');vb.onclick=lista;app.append(vb);
  const g=guardado(m),falta=Math.max(0,m.alvo-g),d=dias(m),p=pct(m);
  const c=el('div','card');
  c.append(el('h2','',m.nome),el('div','big',kz(g)+' / '+kz(m.alvo)),barra(m),el('div','mut',p+'% concluído · Falta '+kz(falta)));
  app.append(c);
  app.append(el('div','msg',mensagem(p)));
  const pl=el('div','card');pl.append(el('h2','',falta>0?'Como chegar lá':'Meta concluída'));
  if(falta>0&&m.plano){
    const pd=porDia(m.plano.v,m.plano.freq),n=Math.ceil(falta/pd);
    pl.append(el('p','mut','Seu plano: guardar '+kz(m.plano.v)+' '+nomeFreq[m.plano.freq]+'.'));
    const r0=el('div','row');r0.append(el('span','','Tempo restante'),el('b','',tempo(n)));pl.append(r0);
    const r1=el('div','row');r1.append(el('span','','Data prevista'),el('b','',dataPrev(n)));pl.append(r1);
    [['Por dia',Math.ceil(pd)],['Por semana',Math.ceil(pd*7)],['Por mês',Math.ceil(pd*30)]].forEach(([k,v])=>{
      const r=el('div','row');r.append(el('span','',k),el('b','',kz(v)));pl.append(r)});
  }else if(falta>0){
    const base=falta/Math.max(d,1);
    pl.append(el('p','mut',d>0?'Faltam '+d+' dias. Você precisa guardar aproximadamente:':'O prazo terminou. Para fechar a meta, guarde:'));
    [['Por dia',Math.ceil(base)],['Por semana',Math.ceil(base*7)],['Por mês',Math.ceil(base*30)]].forEach(([k,v])=>{
      const r=el('div','row');r.append(el('span','',k),el('b','',kz(v)));pl.append(r)});
  }
  app.append(pl);
  const af=el('div','card');af.append(el('h2','','Adicionar dinheiro'));
  const vi=el('input');vi.type='number';vi.inputMode='numeric';vi.placeholder='Valor em Kz';af.append(vi);
  const ab=el('button','pri','＋ Adicionar dinheiro');
  ab.onclick=async()=>{const v=+vi.value;
    if(!(v>0)){await modal({tipo:'erro',titulo:'Falha ao adicionar',texto:'Digite um valor maior que zero.'});return}
    await processar('Adicionando depósito...');const antes=guardado(m)<m.alvo;m.dep.unshift({v,d:hoje(),id:Date.now()});salvar();detalhe(id);
    if(antes&&guardado(m)>=m.alvo){confete();notificar('Meta alcançada!','Parabéns! "'+m.nome+'" chegou a '+kz(m.alvo)+'.');modal({tipo:'sucesso',fixo:1,titulo:'Meta alcançada!',texto:'Parabéns! Você chegou aos '+kz(m.alvo)+'.',ok:'Continuar'})}
    else modal({tipo:'sucesso',titulo:'Depósito adicionado!',texto:kz(v)+' guardados. Falta '+kz(Math.max(0,m.alvo-guardado(m)))+'.'})};
  af.append(ab);app.append(af);
  const s=sequencia(m),dc=el('div','fire');
  dc.append(el('b','','🔥 Modo desafio: '+s+(s===1?' dia seguido':' dias seguidos')),
    el('div','mut',m.dep.some(x=>x.d===hoje())?'Hoje você já guardou. Volte amanhã!':'Guarde hoje para manter a sequência.'));
  dc.lastChild.style.color='#b9d3c9';app.append(dc);
  const sl=el('div','card slot');
  sl.innerHTML='<!-- ANÚNCIO DISCRETO (opcional): cole aqui um segundo banner da Adsterra -->';app.append(sl);
  const h=el('div','card');h.append(el('h2','','Histórico'));
  if(!m.dep.length)h.append(el('p','mut','Nenhum depósito ainda.'));
  m.dep.forEach(x=>{
    const r=el('div','dep');r.append(el('span','',x.d.split('-').reverse().join('/')+' · '+kz(x.v)));
    const del=el('button','','Apagar');del.onclick=async()=>{if(await modal({tipo:'confirmar',titulo:'Apagar depósito?',texto:kz(x.v)+' serão removidos do histórico.',ok:'Apagar'})){await processar('Apagando depósito...');m.dep=m.dep.filter(y=>y!==x);salvar();detalhe(id);modal({tipo:'sucesso',titulo:'Depósito apagado'})}};
    r.append(del);h.append(r)});
  app.append(h);
  const z=el('button','zap','Compartilhar no WhatsApp');
  z.onclick=()=>{const t='Minha meta "'+m.nome+'": já guardei '+kz(g)+' de '+kz(m.alvo)+' ('+p+'%). Faltam '+kz(falta)+'. Feito com o app Meta 100K.';
    window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank')};
  app.append(z);
  const eb=el('button','sec','Editar meta');eb.onclick=()=>nova(m);app.append(eb);
  const ap=el('button','zero','Apagar esta meta');
  ap.onclick=async()=>{if(await modal({tipo:'confirmar',titulo:'Apagar esta meta?',texto:'"'+m.nome+'" e todo o histórico serão removidos.',ok:'Apagar'})){await processar('Apagando meta...');metas=metas.filter(x=>x!==m);salvar();lista();modal({tipo:'sucesso',titulo:'Meta apagada'})}};
  app.append(ap);
}
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
let calMes=new Date(new Date().getFullYear(),new Date().getMonth(),1),calSel=hoje();
function calendario(){
  tela(1);
  const dep={},pz={};
  metas.forEach(m=>{m.dep.forEach(x=>{(dep[x.d]=dep[x.d]||[]).push({m:m.nome,v:x.v})});if(guardado(m)<m.alvo)(pz[m.prazo]=pz[m.prazo]||[]).push(m.nome)});
  const c=el('div','card'),h=el('div','mes');
  const p=el('button','','‹'),n=el('button','','›');
  p.onclick=()=>{calMes=new Date(calMes.getFullYear(),calMes.getMonth()-1,1);calendario()};
  n.onclick=()=>{calMes=new Date(calMes.getFullYear(),calMes.getMonth()+1,1);calendario()};
  h.append(p,el('b','',MESES[calMes.getMonth()]+' '+calMes.getFullYear()),n);c.append(h);
  const g=el('div','cal');['D','S','T','Q','Q','S','S'].forEach(x=>g.append(el('b','',x)));
  const ini=calMes.getDay(),tot=new Date(calMes.getFullYear(),calMes.getMonth()+1,0).getDate();
  for(let i=0;i<ini;i++)g.append(el('button','d vz'));
  for(let d=1;d<=tot;d++){
    const key=iso(new Date(calMes.getFullYear(),calMes.getMonth(),d));
    const b=el('button','d'+(dep[key]?' tem':'')+(key===hoje()?' hoje':'')+(key===calSel?' sel':''),String(d));
    if(pz[key])b.append(el('i'));
    b.onclick=()=>{calSel=key;calendario()};g.append(b);
  }
  c.append(g,el('p','mut','Verde: dias com depósito · Ponto vermelho: prazo de uma meta'));app.append(c);
  const det=el('div','card');det.append(el('h2','',calSel.split('-').reverse().join('/')));
  const L=dep[calSel]||[],P=pz[calSel]||[];
  if(!L.length&&!P.length)det.append(el('p','mut','Nada registrado neste dia.'));
  L.forEach(x=>{const r=el('div','row');r.append(el('span','',x.m),el('b','','+ '+kz(x.v)));det.append(r)});
  P.forEach(x=>{const r=el('div','row');r.append(el('span','','Prazo: '+x),el('b','','⏰'));det.append(r)});
  app.append(det);
}
function relatorio(){
  tela(2);
  const deps=metas.flatMap(m=>m.dep),tot=metas.reduce((s,m)=>s+guardado(m),0),alvo=metas.reduce((s,m)=>s+m.alvo,0);
  const conc=metas.filter(m=>guardado(m)>=m.alvo).length,soma=deps.reduce((s,d)=>s+d.v,0);
  const lim=n=>{const d=new Date();d.setDate(d.getDate()-n);return iso(d)};
  const ult=n=>deps.filter(d=>d.d>=lim(n)).reduce((s,d)=>s+d.v,0);
  const seq=metas.reduce((s,m)=>Math.max(s,sequencia(m)),0);
  app.append(el('h2','','Relatório'));
  const k=el('div','kpi');
  [['Total guardado',kz(tot)],['Total das metas',kz(alvo)],['Progresso geral',(alvo?Math.round(tot/alvo*100):0)+'%'],['Metas concluídas',conc+' de '+metas.length],
   ['Últimos 7 dias',kz(ult(6))],['Últimos 30 dias',kz(ult(29))],['Depósitos feitos',String(deps.length)],['Média por depósito',kz(deps.length?soma/deps.length:0)],
   ['Maior depósito',kz(deps.reduce((s,d)=>Math.max(s,d.v),0))],['Melhor sequência',seq+(seq===1?' dia':' dias')]].forEach(([t,v])=>{const d=el('div');d.append(el('b','',v),el('span','',t));k.append(d)});
  app.append(k);
  const c=el('div','card');c.append(el('h2','','Por meta'));
  if(!metas.length)c.append(el('p','mut','Crie uma meta para ver o relatório.'));
  metas.forEach(m=>{const r=el('div','row');r.append(el('span','',m.nome),el('b','',pct(m)+'%'));c.append(r)});
  app.append(c);
  const z=el('button','zap','Compartilhar relatório no WhatsApp');
  z.onclick=()=>{const t='Meu relatório Meta 100K: guardei '+kz(tot)+' de '+kz(alvo)+' ('+(alvo?Math.round(tot/alvo*100):0)+'%). Metas concluídas: '+conc+' de '+metas.length+'. Últimos 30 dias: '+kz(ult(29))+'.';window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank')};
  app.append(z);
}
function definicoes(){
  tela(3);app.append(el('h2','','Definições'));
  const n=el('div','card');n.append(el('h2','','Notificações'),el('p','mut','Receba um aviso quando uma meta for atingida.'));
  const nb=el('button',cfg.notif?'sec':'pri',cfg.notif?'Desativar notificações':'Ativar notificações');
  nb.onclick=async()=>{
    if(cfg.notif){cfg.notif=false;salvarCfg();definicoes();return}
    if(!('Notification' in window)){await modal({tipo:'erro',titulo:'Não disponível',texto:'Este aparelho ou app não suporta notificações. Você ainda verá o aviso dentro do app.'});return}
    let p=Notification.permission;if(p==='default')p=await Notification.requestPermission();
    if(p==='granted'){cfg.notif=true;salvarCfg();definicoes();modal({tipo:'sucesso',titulo:'Notificações ativadas'})}
    else await modal({tipo:'erro',titulo:'Permissão negada',texto:'Ative as notificações deste app nas configurações do aparelho.'});
  };n.append(nb);app.append(n);
  const r=el('div','card');r.append(el('h2','','Relatório'),el('p','mut','Veja o resumo de tudo o que você guardou.'));
  const rb=el('button','sec','Abrir relatório');rb.onclick=relatorio;r.append(rb);app.append(r);
  const b=el('div','card');b.append(el('h2','','Backup'),el('p','mut','Guarde uma cópia das suas metas para não perder os dados ao trocar de telefone.'));
  const eb=el('button','pri','Exportar backup');
  eb.onclick=async()=>{const j=JSON.stringify({app:'meta100k',metas});
    try{if(navigator.share){await navigator.share({title:'Backup Meta 100K',text:j});return}
      await navigator.clipboard.writeText(j);modal({tipo:'sucesso',fixo:1,titulo:'Backup copiado',texto:'Cole numa nota ou numa conversa para guardar.'})}
    catch(e){if(e&&e.name==='AbortError')return;modal({tipo:'erro',titulo:'Falha ao exportar',texto:'Não foi possível copiar o backup neste aparelho.'})}};
  const ib=el('button','sec','Importar backup');ib.onclick=importar;b.append(eb,ib);app.append(b);
  const v=el('div','card');v.append(el('h2','','Sobre o app'));
  const r1=el('div','row');r1.append(el('span','','Versão do app'),el('b','','v'+VERSAO));v.append(r1);
  const ub=el('button','sec','Verificar atualização');
  ub.onclick=async()=>{await processar('Verificando atualização...');try{const g=await navigator.serviceWorker.getRegistration();if(g)await g.update()}catch(e){}
    modal({tipo:'sucesso',titulo:'Verificação feita',texto:'Se houver uma versão nova, o aviso "Nova versão disponível" aparece.'})};
  v.append(ub);app.append(v);
  const z=el('button','zero','Apagar todos os dados');
  z.onclick=async()=>{if(await modal({tipo:'confirmar',titulo:'Apagar tudo?',texto:'Todas as metas e depósitos serão removidos. Esta ação não pode ser desfeita.',ok:'Apagar tudo'})){await processar('Apagando dados...');metas=[];salvar();lista();modal({tipo:'sucesso',titulo:'Dados apagados'})}};
  app.append(z);
}
function importar(){
  tela(3);const c=el('div','card');c.append(el('h2','','Importar backup'),el('p','mut','Cole aqui o texto do backup. As metas que já existem são mantidas.'));
  const t=el('textarea');t.placeholder='Cole o backup aqui';c.append(t);
  const ok=el('button','pri','Importar');
  ok.onclick=async()=>{
    try{const d=JSON.parse(t.value),arr=Array.isArray(d)?d:d.metas;
      if(!Array.isArray(arr)||!arr.every(m=>m&&m.id&&m.nome&&m.alvo>0&&Array.isArray(m.dep)))throw 0;
      await processar('Importando metas...');const novas=arr.filter(m=>!metas.some(x=>x.id===m.id));metas=metas.concat(novas);salvar();definicoes();
      modal({tipo:'sucesso',titulo:'Backup importado',texto:novas.length+(novas.length===1?' meta adicionada.':' metas adicionadas.')})}
    catch(e){await modal({tipo:'erro',titulo:'Falha ao importar',texto:'O texto colado não é um backup válido do Meta 100K.'})}
  };
  const v=el('button','sec','Voltar');v.onclick=definicoes;c.append(ok,v);app.append(c);
}
function intro(){
  const o=document.getElementById('intro');if(!o)return;
  let visto=null;try{visto=sessionStorage.getItem('iv')}catch(e){}
  if(visto||matchMedia('(prefers-reduced-motion: reduce)').matches){o.remove();return}
  try{sessionStorage.setItem('iv','1')}catch(e){}
  const c=document.getElementById('icont'),t0=performance.now()+1200;
  (function f(t){const p=Math.min(1,Math.max(0,(t-t0)/2000));c.textContent=kz(100000*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(performance.now());
  const fim=()=>{o.classList.add('sai');setTimeout(()=>o.remove(),550)};
  o.onclick=fim;setTimeout(fim,4200);
}

if('serviceWorker' in navigator){
  let clicou=false,rec=false;
  navigator.serviceWorker.register('sw.js').then(reg=>{
    const pronto=w=>{document.getElementById('aviso').style.display='flex';document.getElementById('atualizar').onclick=()=>{clicou=true;w.postMessage('ativar')}};
    if(reg.waiting&&navigator.serviceWorker.controller)pronto(reg.waiting);
    reg.addEventListener('updatefound',()=>{const n=reg.installing;n.addEventListener('statechange',()=>{if(n.state==='installed'&&navigator.serviceWorker.controller)pronto(n)})});
    setInterval(()=>reg.update().catch(()=>{}),60000);
  }).catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(rec||!clicou)return;rec=true;location.reload()});
}
