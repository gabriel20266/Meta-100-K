<header><div class="hl">100K</div><div class="ht"><b>Meta 100K</b><small id="ola">Olá</small></div><span id="sync"></span><button class="hs" onclick="sincronizar()" aria-label="Sincronizar"><svg class="i"><use href="#sin"/></svg></button></header>
<div id="lock"></div>
<div id="auth"></div>
<div id="app"></div>
<nav id="nav"><button data-i="0" onclick="lista()"><svg class="i"><use href="#metas"/></svg>Metas</button><button data-i="2" onclick="relatorio()"><svg class="i"><use href="#rel"/></svg>Relatório</button><button data-i="4" id="navadm" onclick="admin()" style="display:none"><svg class="i"><use href="#adm"/></svg>Admin<span class="bdg" id="bdg"></span></button><button data-i="3" onclick="definicoes()"><svg class="i"><use href="#aj"/></svg>Ajustes</button></nav>
<button class="fab" id="fab" onclick="nova()" aria-label="Nova meta"><svg class="i"><use href="#mais"/></svg></button>
<div id="aviso"><span>Nova versão disponível</span><button id="atualizar">Atualizar</button></div>
<script>
const VERSAO='2.7',app=document.getElementById('app');
let metas=[];
let atual=null;

const mo=()=>'Kz';
const kz=n=>{const v=Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.');return mo()==='Kz'?v+' Kz':mo()+' '+v};
const iso=d=>{const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)};
const hoje=()=>iso(new Date());
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e};
const guardado=m=>m.inicial+m.dep.reduce((s,d)=>s+d.v,0);
const dias=m=>Math.max(0,Math.ceil((new Date(m.prazo+'T00:00')-new Date(hoje()+'T00:00'))/864e5));
const porDia=(v,f)=>f==='diario'?v:f==='semanal'?v/7:v/30;
const nomeFreq={diario:'por dia',semanal:'por semana',mensal:'por mês'};
const tempo=n=>n+(n===1?' dia':' dias')+' (≈ '+Math.ceil(n/7)+(Math.ceil(n/7)===1?' semana':' semanas')+' ou ≈ '+(n/30).toFixed(1).replace('.',',')+' meses)';
const dataPrev=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d).split('-').reverse().join('/')};
const pct=m=>Math.min(100,Math.round(guardado(m)/m.alvo*100));
function sequencia(m){
  const ds=new Set(m.dep.map(d=>d.d));let n=0,d=new Date();
  if(!ds.has(iso(d)))d.setDate(d.getDate()-1);
  while(ds.has(iso(d))){n++;d.setDate(d.getDate()-1)}return n;
}
function mensagem(p){
  if(p>=100)return 'Meta alcançada! Parabéns, você conseguiu!';
  if(p>=75)return 'Falta pouco! Você está na reta final.';
  if(p>=50)return 'Já passou da metade. Continue assim!';
  if(p>=25)return 'Bom ritmo! Cada depósito conta.';
  if(p>0)return 'Ótimo começo! O primeiro passo já foi dado.';
  return 'Comece hoje. Até um pequeno valor já ajuda.';
}
function barra(m){const b=el('div','bar'),i=el('i');i.style.width='0%';b.append(i);requestAnimationFrame(()=>requestAnimationFrame(()=>{i.style.width=pct(m)+'%'}));return b}
function modal(o){return new Promise(res=>{
  const ov=el('div','ov'),bx=el('div','mod '+o.tipo),bt=el('div','mb'),ic=el('div','ic');
  const P={sucesso:'<path class="k" d="M16 27l7 7 14-15"/>',erro:'<path class="k" d="M18 18l16 16M34 18L18 34"/>',confirmar:'<path class="k" d="M26 15v14M26 36v.5"/>',info:'<path class="k" d="M26 24v13M26 16v.5"/>'}[o.tipo];
  ic.innerHTML='<svg viewBox="0 0 52 52"><circle class="c" cx="26" cy="26" r="23"/>'+P+'</svg>';
  bx.append(ic,el('h3','',o.titulo),el('p','mut',o.texto||''));
  let t;const fecha=v=>{clearTimeout(t);ov.classList.add('sai');setTimeout(()=>{ov.remove();res(v)},200)};
  if(o.tipo==='confirmar'){const c=el('button','sec','Cancelar');c.onclick=()=>fecha(false);bt.append(c)}
  const ok=el('button',o.tipo==='confirmar'?'zero2':'pri',o.ok||(o.tipo==='erro'?'Fechar':'OK'));ok.onclick=()=>fecha(true);bt.append(ok);
  bx.append(bt);
  if(o.tipo==='sucesso'&&!o.fixo){bx.append(el('div','tempo'));t=setTimeout(()=>fecha(true),3000)}
  ov.append(bx);ov.onclick=e=>{if(e.target===ov)fecha(false)};document.body.append(ov);
  try{navigator.vibrate&&navigator.vibrate(o.tipo==='erro'?[60,40,60]:30)}catch(e){}
})}
function processar(txt){return new Promise(res=>{const ov=ovProc(txt);setTimeout(()=>{ov.remove();res()},3000)})}
function confete(){const cor=['#F2B705','#1E9E6A','#0C5A46','#C8433B','#fff'];
  for(let i=0;i<40;i++){const c=el('span','cf');c.style.left=Math.random()*100+'vw';c.style.background=cor[i%5];
    c.style.animationDuration=(1.6+Math.random()*1.6)+'s';c.style.animationDelay=Math.random()*.4+'s';document.body.append(c);setTimeout(()=>c.remove(),3800)}}
function tela(i){naLista=false;app.innerHTML='';window.scrollTo(0,0);const f=document.getElementById('fab');if(f)f.style.display='none';document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',+b.dataset.i===i))}
const DICAS=['Guarde primeiro, gaste depois: separe o valor da meta assim que receber.','Pequenos valores todos os dias vencem grandes valores raros.','Anote seus gastos por uma semana. Você vai descobrir dinheiro escondido.','Meta sem prazo vira sonho. Defina uma data.','Antes de comprar por impulso, espere 24 horas.','Tenha uma reserva de emergência antes de outras metas.','Comemore cada 25% da meta alcançada.','Conte a alguém sobre a sua meta. Isso ajuda a manter o compromisso.','Venda o que não usa e coloque o valor na meta.','Compare preços antes de comprar. A diferença vai para a sua meta.','Guarde o troco e as notas pequenas num lugar separado.','Revise a meta uma vez por semana e ajuste se precisar.'];
let cfg={notif:false};try{cfg=Object.assign(cfg,JSON.parse(localStorage.getItem('cfg100k')||'{}'))}catch(e){}
const salvarCfg=()=>{try{localStorage.setItem('cfg100k',JSON.stringify(cfg))}catch(e){}};
function notificar(t,c){
  if(!cfg.notif||!('Notification' in window)||Notification.permission!=='granted')return;
  try{navigator.serviceWorker.getRegistration().then(r=>{if(r)r.showNotification(t,{body:c,icon:'icon-192.png'});else new Notification(t,{body:c,icon:'icon-192.png'})})}catch(e){}
}
const I=n=>'<svg class="i"><use href="#'+n+'"/></svg>';
let filtro='ativas',busca='',ordem=0;const ORD=['Mais recentes','Maior progresso','Prazo mais próximo'];
const concl=m=>guardado(m)>=m.alvo;
const valDia=m=>m.plano?Math.ceil(porDia(m.plano.v,m.plano.freq)):Math.ceil(Math.max(0,m.alvo-guardado(m))/Math.max(dias(m),1));
function cartoes(){
  const g=document.getElementById('gl');if(!g)return;g.innerHTML='';
  let l=metas.filter(m=>filtro==='ativas'?!concl(m):concl(m));
  if(busca)l=l.filter(m=>m.nome.toLowerCase().includes(busca.toLowerCase()));
  l=l.slice().sort(ordem===1?(a,b)=>pct(b)-pct(a):ordem===2?(a,b)=>dias(a)-dias(b):(a,b)=>b.id-a.id);
  if(!l.length){const v=el('div','vz');v.append(el('b','',busca?'Nenhum resultado':filtro==='ativas'?'Nenhuma meta ativa':'Nenhuma meta concluída'),el('span','',busca?'Tente outro nome.':filtro==='ativas'?'Toque em + para criar a sua primeira meta.':'As metas concluídas aparecem aqui.'));g.append(v);return}
  l.forEach(m=>{
    const c=el('div','gc'),r=el('div','r'),ic=el('span','ic2'),t=el('div');ic.innerHTML=I('metas');
    const sub=concl(m)?'Meta concluída':(m.plano?'Plano: '+kz(m.plano.v)+' '+nomeFreq[m.plano.freq]:'Faltam '+dias(m)+' dias')+' · '+kz(valDia(m))+'/dia';
    t.append(el('b','',m.nome),el('small','',sub));r.append(ic,t,el('span','pc',pct(m)+'%'));
    c.append(r,barra(m),el('small','',kz(guardado(m))+' / '+kz(m.alvo)));c.onclick=()=>detalhe(m.id);g.append(c);
  });
}
function lista(){
  atual=null;tela(0);naLista=true;document.getElementById('fab').style.display='flex';
  const deps=metas.flatMap(m=>m.dep),lim=new Date();lim.setDate(lim.getDate()-29);
  const u30=deps.filter(d=>d.d>=iso(lim)).reduce((s,d)=>s+d.v,0),tot=metas.reduce((s,m)=>s+guardado(m),0);
  const h=el('div','hero');h.append(el('small','','Total guardado'),el('b','',kz(tot)),el('em','',kz(u30)+' nos últimos 30 dias'));app.append(h);
  const na=metas.filter(m=>!concl(m)).length,nc=metas.length-na,tl=el('div','tl');
  [['Metas ativas',na,''],['Concluídas',nc,'color:var(--ok)']].forEach(([k,v,st])=>{const d=el('div','t');d.append(el('small','',k),el('b','',String(v)));if(st)d.lastChild.style.cssText=st;tl.append(d)});
  app.append(tl);
  if(metas.length&&!metas.some(m=>m.dep.some(d=>d.d===hoje())))app.append(el('div','msg','Você ainda não guardou hoje. Que tal adicionar um valor?'));
  const sg=el('div','seg');[['ativas','Ativas · '+na],['concluidas','Concluídas · '+nc]].forEach(([k,t])=>{const b=el('button',filtro===k?'on':'',t);b.onclick=()=>{filtro=k;lista()};sg.append(b)});app.append(sg);
  const sr=el('div','sr'),q=el('input');q.type='search';q.placeholder='Buscar meta...';q.value=busca;q.autocomplete='off';q.oninput=()=>{busca=q.value;cartoes()};
  const ob=el('button','ibn');ob.innerHTML=I('ord');ob.setAttribute('aria-label','Ordenar');
  const ol=el('div','ord','Ordem: '+ORD[ordem]);ob.onclick=()=>{ordem=(ordem+1)%ORD.length;ol.textContent='Ordem: '+ORD[ordem];cartoes()};
  sr.append(q,ob);app.append(sr,ol);
  const gl=el('div');gl.id='gl';app.append(gl);cartoes();
  const dc=el('div','dica');dc.append(el('b','','💡 Dica do dia'),el('div','',DICAS[Math.floor(Date.now()/864e5)%DICAS.length]));app.append(dc);
}
function nova(ed){
  tela(0);const f=el('div','card');let modo=ed&&ed.plano?'quantia':'prazo',freq=ed&&ed.plano?ed.plano.freq:'semanal';
  f.append(el('h2','',ed?'Editar meta':'Nova meta'));
  f.append(el('label','','Nome da meta'));const nome=el('input');nome.maxLength=60;nome.placeholder='Ex: Comprar telefone';if(ed)nome.value=ed.nome;f.append(nome);
  f.append(el('label','','Minha meta'));
  const ch=el('div','chips'),av=el('input');av.type='number';av.inputMode='numeric';av.value=ed?ed.alvo:100000;
  [50000,100000,500000,1000000].forEach(v=>{const c=el('button','chip',kz(v));c.onclick=()=>{av.value=v;mark();prev()};ch.append(c)});
  const outro=el('button','chip','Outro valor');outro.onclick=()=>{av.value='';av.focus();mark();prev()};ch.append(outro);
  const mark=()=>[...ch.children].forEach(c=>c.classList.toggle('on',c.textContent===kz(+av.value)));
  av.oninput=()=>{mark();prev()};f.append(ch,av);mark();
  f.append(el('label','','Quanto já tenho ('+mo()+')'));const ini=el('input');ini.type='number';ini.inputMode='numeric';ini.value=ed?ed.inicial:0;ini.oninput=()=>prev();f.append(ini);
  f.append(el('label','','Como quer planear?'));
  const mc=el('div','chips'),m1=el('button','chip on','Tenho um prazo'),m2=el('button','chip','Tenho uma quantia');
  mc.append(m1,m2);f.append(mc);
  const bp=el('div'),bq=el('div');bq.style.display='none';
  bp.append(el('label','','Prazo (em dias)'));const pz=el('input');pz.type='number';pz.inputMode='numeric';pz.value=ed?Math.max(1,dias(ed)):60;bp.append(pz);
  bq.append(el('label','','Quanto consigo guardar ('+mo()+')'));const qv=el('input');qv.type='number';qv.inputMode='numeric';qv.placeholder='Ex: 5000';if(ed&&ed.plano)qv.value=ed.plano.v;qv.oninput=()=>prev();bq.append(qv);
  const fc=el('div','chips');
  [['diario','Por dia'],['semanal','Por semana'],['mensal','Por mês']].forEach(([k,t])=>{
    const c=el('button','chip'+(k===freq?' on':''),t);c.onclick=()=>{freq=k;[...fc.children].forEach(x=>x.classList.toggle('on',x===c));prev()};fc.append(c)});
  bq.append(fc);const pv=el('div','msg','');pv.style.display='none';bq.append(pv);
  f.append(bp,bq);
  function prev(){
    const falta=+av.value-(+ini.value||0),v=+qv.value;
    if(modo==='quantia'&&v>0&&falta>0){const n=Math.ceil(falta/porDia(v,freq));pv.style.display='block';pv.textContent='Guardando '+kz(v)+' '+nomeFreq[freq]+', você chega lá em '+tempo(n)+'.'}
    else pv.style.display='none';
  }
  const setModo=x=>{modo=x;m1.classList.toggle('on',x==='prazo');m2.classList.toggle('on',x==='quantia');bp.style.display=x==='prazo'?'block':'none';bq.style.display=x==='quantia'?'block':'none';prev()};
  m1.onclick=()=>setModo('prazo');m2.onclick=()=>setModo('quantia');if(modo==='quantia')setModo('quantia');
  const ok=el('button','pri',ed?'Salvar alterações':'Criar meta');
  ok.onclick=async()=>{
    const a=+av.value,i=+ini.value||0;
    if(!nome.value.trim()||!(a>0&&a<=1e12)||i<0||i>=a){await modal({tipo:'erro',titulo:'Falha ao criar meta',texto:'Preencha o nome e uma meta maior que o valor inicial.'});return}
    const m=ed?JSON.parse(JSON.stringify(ed)):{id:Date.now(),criada:hoje(),dep:[]};m.nome=nome.value.trim();m.alvo=a;m.inicial=i;
    let n;
    if(modo==='quantia'){const v=+qv.value;if(!(v>0)){await modal({tipo:'erro',titulo:'Falha ao criar meta',texto:'Digite quanto consegue guardar.'});return}
      m.plano={v,freq};n=Math.ceil((a-i)/porDia(v,freq))}
    else{n=Math.floor(+pz.value);if(!(n>0)){await modal({tipo:'erro',titulo:'Falha ao criar meta',texto:'Digite o prazo em dias.'});return}delete m.plano}
    const d=new Date();d.setDate(d.getDate()+n);m.prazo=iso(d);
    await processar(ed?'Guardando alterações...':'Criando meta...');if(ed){delete ed.plano;Object.assign(ed,m)}else metas.push(m);salvar();detalhe(m.id);modal(ed?{tipo:'sucesso',titulo:'Meta atualizada!',texto:'As alterações foram guardadas e o histórico foi mantido.'}:{tipo:'sucesso',titulo:'Meta criada!',texto:'"'+m.nome+'" já está pronta. Comece a guardar!'});
  };
  const v=el('button','sec','Voltar');v.onclick=ed?()=>detalhe(ed.id):lista;f.append(ok,v);app.append(f);
}
function detalhe(id){
  const m=metas.find(x=>x.id===id);if(!m)return lista();atual=id;tela(0);
  const vb=el('button','back','‹ Minhas metas');vb.onclick=lista;app.append(vb);
  const g=guardado(m),falta=Math.max(0,m.alvo-g),d=dias(m),p=pct(m);
  const c=el('div','card'),rg=el('div','rg'),ct=el('div');c.style.textAlign='center';
  rg.innerHTML='<svg width="140" height="140"><circle cx="70" cy="70" r="59" fill="none" stroke="#DCE7E2" stroke-width="12"/><circle cx="70" cy="70" r="59" fill="none" stroke="var(--g2)" stroke-width="12" stroke-linecap="round" stroke-dasharray="371" stroke-dashoffset="'+(371*(1-p/100)).toFixed(1)+'"/></svg>';
  ct.append(el('b','',p+'%'),el('small','','concluído'));rg.append(ct);
  c.append(el('h2','',m.nome),rg,el('div','mut',kz(g)+' / '+kz(m.alvo)+' · falta '+kz(falta)));app.append(c);
  app.append(el('div','msg',mensagem(p)));
  const pl=el('div','card');pl.append(el('h2','',falta>0?'Como chegar lá':'Meta concluída'));
  if(falta>0&&m.plano){
    const pd=porDia(m.plano.v,m.plano.freq),n=Math.ceil(falta/pd);
    pl.append(el('p','mut','Seu plano: guardar '+kz(m.plano.v)+' '+nomeFreq[m.plano.freq]+'.'));
    const r0=el('div','row');r0.append(el('span','','Tempo restante'),el('b','',tempo(n)));pl.append(r0);
    const r1=el('div','row');r1.append(el('span','','Data prevista'),el('b','',dataPrev(n)));pl.append(r1);
    [['Por dia',Math.ceil(pd)],['Por semana',Math.ceil(pd*7)],['Por mês',Math.ceil(pd*30)]].forEach(([k,v])=>{
      const r=el('div','row');r.append(el('span','',k),el('b','',kz(v)));pl.append(r)});
  }else if(falta>0){
    const base=falta/Math.max(d,1);
    pl.append(el('p','mut',d>0?'Faltam '+d+' dias. Você precisa guardar aproximadamente:':'O prazo terminou. Para fechar a meta, guarde:'));
    [['Por dia',Math.ceil(base)],['Por semana',Math.ceil(base*7)],['Por mês',Math.ceil(base*30)]].forEach(([k,v])=>{
      const r=el('div','row');r.append(el('span','',k),el('b','',kz(v)));pl.append(r)});
  }
  app.append(pl);
  evolucao(m);
  const af=el('div','card');af.append(el('h2','','Adicionar dinheiro'));
  const vi=el('input');vi.type='number';vi.inputMode='numeric';vi.placeholder='Valor em '+mo();af.append(vi);
  const ab=el('button','pri','＋ Adicionar dinheiro');
  ab.onclick=async()=>{const v=+vi.value;
    if(!(v>0&&v<=1e12)){await modal({tipo:'erro',titulo:'Falha ao adicionar',texto:'Digite um valor válido, maior que zero.'});return}
    await processar('Adicionando depósito...');const antes=guardado(m)<m.alvo;m.dep.unshift({v,d:hoje(),id:Date.now()});salvar();detalhe(id);
    if(antes&&guardado(m)>=m.alvo){confete();notificar('Meta alcançada!','Parabéns! "'+m.nome+'" chegou a '+kz(m.alvo)+'.');modal({tipo:'sucesso',fixo:1,titulo:'Meta alcançada!',texto:'Parabéns! Você chegou aos '+kz(m.alvo)+'.',ok:'Continuar'})}
    else modal({tipo:'sucesso',titulo:'Depósito adicionado!',texto:kz(v)+' guardados. Falta '+kz(Math.max(0,m.alvo-guardado(m)))+'.'})};
  af.append(ab);app.append(af);
  const s=sequencia(m),dc=el('div','fire');
  dc.append(el('b','','🔥 Modo desafio: '+s+(s===1?' dia seguido':' dias seguidos')),
    el('div','mut',m.dep.some(x=>x.d===hoje())?'Hoje você já guardou. Volte amanhã!':'Guarde hoje para manter a sequência.'));
  dc.lastChild.style.color='#b9d3c9';app.append(dc);
  const h=el('div','card');h.append(el('h2','','Histórico'));
  if(!m.dep.length)h.append(el('p','mut','Nenhum depósito ainda.'));
  m.dep.forEach(x=>{
    const r=el('div','dep');r.append(el('span','',x.d.split('-').reverse().join('/')+' · '+kz(x.v)));
    const del=el('button','','Apagar');del.onclick=async()=>{if(await modal({tipo:'confirmar',titulo:'Apagar depósito?',texto:kz(x.v)+' serão removidos do histórico.',ok:'Apagar'})){await processar('Apagando depósito...');m.dep=m.dep.filter(y=>y!==x);salvar();detalhe(id);modal({tipo:'sucesso',titulo:'Depósito apagado'})}};
    r.append(del);h.append(r)});
  app.append(h);
  const z=el('button','zap','Compartilhar no WhatsApp');
  z.onclick=()=>wa(textoWA(m));
  app.append(z);
  const eb=el('button','sec','Editar meta');eb.onclick=()=>nova(m);app.append(eb);
  const ap=el('button','zero','Apagar esta meta');
  ap.onclick=async()=>{if(await modal({tipo:'confirmar',titulo:'Apagar esta meta?',texto:'"'+m.nome+'" e todo o histórico serão removidos.',ok:'Apagar'})){await processar('Apagando meta...');metas=metas.filter(x=>x!==m);salvar();lista();modal({tipo:'sucesso',titulo:'Meta apagada'})}};
  app.append(ap);
}
function definicoes(){
  tela(3);app.append(el('h2','','Definições'));contaCard();prefCards();segCard();
  const n=el('div','card');n.append(el('h2','','Notificações'),el('p','mut','Receba um aviso quando uma meta for atingida.'));
  const nb=el('button',cfg.notif?'sec':'pri',cfg.notif?'Desativar notificações':'Ativar notificações');
  nb.onclick=async()=>{
    if(cfg.notif){cfg.notif=false;salvarCfg();definicoes();return}
    if(!('Notification' in window)){await modal({tipo:'erro',titulo:'Não disponível',texto:'Este aparelho ou app não suporta notificações. Você ainda verá o aviso dentro do app.'});return}
    let p=Notification.permission;if(p==='default')p=await Notification.requestPermission();
    if(p==='granted'){cfg.notif=true;salvarCfg();definicoes();modal({tipo:'sucesso',titulo:'Notificações ativadas'})}
    else await modal({tipo:'erro',titulo:'Permissão negada',texto:'Ative as notificações deste app nas configurações do aparelho.'});
  };n.append(nb);app.append(n);

function juntar(a,b){
  const base=(a.up||0)>=(b.up||0)?a:b,ids={},dep=[];
  a.dep.concat(b.dep).forEach(d=>{if(!ids[d.id]){ids[d.id]=1;dep.push(d)}});
  dep.sort((x,y)=>y.d.localeCompare(x.d)||y.id-x.id);
  return Object.assign({},base,{dep:dep,up:Date.now()});
}

function evolucao(m){
  const c=el('div','card');c.append(el('h2','','Evolução'));
  const sem=[],h0=new Date(hoje()+'T00:00');
  for(let i=7;i>=0;i--){const f=new Date(h0);f.setDate(f.getDate()-i*7);const a=new Date(f);a.setDate(a.getDate()-6);sem.push({a:iso(a),b:iso(f),v:0})}
  m.dep.forEach(d=>{const w=sem.find(s=>d.d>=s.a&&d.d<=s.b);if(w)w.v+=d.v});
  const mx=Math.max(1,...sem.map(s=>s.v)),H=90;let svg='<svg viewBox="0 0 300 '+(H+18)+'" width="100%" style="display:block">';
  sem.forEach((s,i)=>{const h=Math.round(s.v/mx*H),x=i*37.5+6;
    svg+='<rect x="'+x+'" y="'+(H-Math.max(h,2))+'" width="26" height="'+Math.max(h,2)+'" rx="5" fill="'+(s.v?'var(--g2)':'#DCE7E2')+'"/><text x="'+(x+13)+'" y="'+(H+13)+'" font-size="9" text-anchor="middle" fill="#5E7269">'+(i===7?'Esta':'-'+(7-i)+'s')+'</text>'});
  const box=el('div');box.innerHTML=svg+'</svg>';c.append(box,el('p','mut','Total guardado por semana nas últimas 8 semanas.'));
  const falta=Math.max(0,m.alvo-guardado(m));
  if(falta>0){
    const l30=iso(new Date(Date.now()-29*864e5)),t30=m.dep.filter(d=>d.d>=l30).reduce((s,d)=>s+d.v,0);
    const desde=Math.max(1,Math.min(30,Math.round((h0-new Date(m.criada+'T00:00'))/864e5)+1)),med=t30/desde;
    if(med>0){
      const n=Math.ceil(falta/med),ok=n<=dias(m);
      c.append(el('div','msg','No seu ritmo atual (≈ '+kz(med)+' por dia), você chega lá em '+n+' dias ('+dataPrev(n)+'). '+(ok?'Está dentro do prazo.':'Atenção: passa do prazo. Para cumprir, guarde cerca de '+kz(Math.ceil(falta/Math.max(dias(m),1)))+' por dia.')));
    }else c.append(el('div','msg','Registe depósitos para ver a previsão do seu ritmo.'));
  }
  app.append(c);
}
function limpaMeta(m){
  if(!m||typeof m!=='object')return null;
  const dt=/^\d{4}-\d{2}-\d{2}$/,id=Number(m.id),alvo=Number(m.alvo),ini=Number(m.inicial||0);
  if(!isFinite(id)||id<=0||!(alvo>0&&alvo<=1e12)||!(ini>=0&&ini<=1e12)||!dt.test(String(m.prazo)))return null;
  const dep=(Array.isArray(m.dep)?m.dep:[]).slice(0,5000).map(d=>({v:Number(d&&d.v),d:String(d&&d.d),id:Number(d&&d.id)||Date.now()})).filter(d=>d.v>0&&d.v<=1e12&&dt.test(d.d));
  const o={id:id,nome:lim(m.nome,60).trim()||'Meta',alvo:alvo,inicial:ini,criada:dt.test(String(m.criada))?m.criada:hoje(),prazo:m.prazo,dep:dep,up:Number(m.up)||0};
  if(m.plano&&Number(m.plano.v)>0&&Number(m.plano.v)<=1e12&&['diario','semanal','mensal'].includes(m.plano.freq))o.plano={v:Number(m.plano.v),freq:m.plano.freq};
  return o;
}

function resumo(){
  const deps=metas.flatMap(m=>m.dep),tot=metas.reduce((s,m)=>s+guardado(m),0),alvo=metas.reduce((s,m)=>s+m.alvo,0);
  const ult=n=>{const d=new Date();d.setDate(d.getDate()-n);return deps.filter(x=>x.d>=iso(d)).reduce((s,x)=>s+x.v,0)},soma=deps.reduce((s,x)=>s+x.v,0);
  return {deps:deps,tot:tot,alvo:alvo,pg:alvo?Math.round(tot/alvo*100):0,conc:metas.filter(m=>guardado(m)>=m.alvo).length,u7:ult(6),u30:ult(29),n:deps.length,media:deps.length?soma/deps.length:0,maior:deps.reduce((s,x)=>Math.max(s,x.v),0),seq:metas.reduce((s,m)=>Math.max(s,sequencia(m)),0)};
}
const dBR=d=>d.split('-').reverse().join('/');
const pbar=p=>{const n=Math.round(Math.min(100,p)/10);return '▓'.repeat(n)+'░'.repeat(10-n)};
const wa=t=>window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank');
function textoWA(m){
  const nm=((sess&&sess.nome)||'').split(' ')[0],cab='_'+(nm?nm+' · ':'')+dBR(hoje())+'_',rod='\n_Gerado com o app Meta 100K_';
  if(m){const g=guardado(m),p=pct(m);
    return '🎯 *'+m.nome+'*\n'+cab+'\n\n'+pbar(p)+' *'+p+'%*\n💰 Guardado: *'+kz(g)+'*\n🏁 Objetivo: *'+kz(m.alvo)+'*\n⏳ Falta: *'+kz(Math.max(0,m.alvo-g))+'*\n📅 Prazo: '+dBR(m.prazo)+'\n'+rod}
  const r=resumo();
  let t='📊 *Relatório Meta 100K*\n'+cab+'\n\n💰 *Total guardado:* '+kz(r.tot)+'\n🏁 *Total das metas:* '+kz(r.alvo)+'\n📈 *Progresso geral:* '+r.pg+'%\n✅ *Concluídas:* '+r.conc+' de '+metas.length+'\n🗓️ *Últimos 30 dias:* '+kz(r.u30)+'\n';
  if(metas.length)t+='\n*Minhas metas*\n';
  metas.slice(0,10).forEach((x,i)=>{t+=(i+1)+'. *'+x.nome+'*\n    '+pbar(pct(x))+' '+pct(x)+'%\n    '+kz(guardado(x))+' / '+kz(x.alvo)+'\n'});
  return t+rod;
}
function criarPDF(){
  const W=595,H=842,M=40,R=W-M,GR='0.38 0.45 0.42',INK='0.06 0.15 0.12';
  const tem=(TEMAS.find(t=>t[0]===(cfg.tema||'esmeralda'))||TEMAS[0])[2];
  const BR=[1,3,5].map(i=>(parseInt(tem.substr(i,2),16)/255).toFixed(3)).join(' ');
  const esc=t=>String(t).replace(/[–—•]/g,'-').replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/[^\x20-\x7E\xA0-\xFF]/g,'?').replace(/([\\()])/g,'\\$1');
  const W1={' ':.278,'.':.278,',':.278,'%':.889,'/':.278,'-':.333,':':.278,'(':.333,')':.333};
  const tw=(t,s)=>{let w=0;for(const c of String(t))w+=W1[c]||(/[0-9]/.test(c)?.556:/[A-Z]/.test(c)?.667:.52);return w*s};
  let P,y;const pages=[];
  const nova=()=>{P=[];pages.push(P);y=0};
  const T=(x,yy,s,t,b,c,right)=>{const X=right?x-tw(t,s):x;P.push('BT /'+(b?'F2':'F1')+' '+s+' Tf '+(c||INK)+' rg '+X.toFixed(1)+' '+(H-yy).toFixed(1)+' Td ('+esc(t)+') Tj ET')};
  const B=(x,yy,w,h,c)=>P.push(c+' rg '+x.toFixed(1)+' '+(H-yy-h).toFixed(1)+' '+w.toFixed(1)+' '+h.toFixed(1)+' re f');
  const cut=(t,n)=>t.length>n?t.slice(0,n-1)+'.':t;
  const r=resumo(),nm=(sess&&sess.nome)||'';
  nova();B(0,0,W,96,BR);T(M,46,22,'Relatório Meta 100K',1,'1 1 1');T(M,68,10,'Gerado em '+dBR(hoje())+(nm?' · '+nm:''),0,'0.88 0.94 0.91');
  const k=[['Total guardado',kz(r.tot)],['Total das metas',kz(r.alvo)],['Progresso geral',r.pg+'%'],['Metas concluídas',r.conc+' de '+metas.length],
    ['Últimos 7 dias',kz(r.u7)],['Últimos 30 dias',kz(r.u30)],['Depósitos feitos',String(r.n)],['Média por depósito',kz(r.media)]];
  const bw=(R-M-30)/4;
  k.forEach((x,i)=>{const bx=M+(i%4)*(bw+10),by=114+Math.floor(i/4)*62;B(bx,by,bw,52,'0.94 0.96 0.95');T(bx+8,by+18,7.5,x[0].toUpperCase(),1,GR);T(bx+8,by+40,12.5,x[1],1,INK)});
  y=262;T(M,y,13,'Metas',1,BR);y+=12;
  const cab=()=>{B(M,y,R-M,20,'0.90 0.94 0.92');T(M+6,y+13,8,'META',1,GR);T(255,y+13,8,'GUARDADO',1,GR,1);T(325,y+13,8,'OBJETIVO',1,GR,1);T(395,y+13,8,'FALTA',1,GR,1);T(405,y+13,8,'PRAZO',1,GR);T(R-6,y+13,8,'%',1,GR,1);y+=26};
  cab();
  if(!metas.length){T(M+6,y+12,10,'Nenhuma meta criada.',0,GR);y+=28}
  metas.forEach(m=>{
    if(y+30>H-70){nova();y=50;T(M,y,11,'Relatório Meta 100K (continuação)',1,BR);y+=16;cab()}
    const g=guardado(m),p=pct(m);
    T(M+6,y+10,9.5,cut(m.nome,26),1);T(255,y+10,9,kz(g),0,INK,1);T(325,y+10,9,kz(m.alvo),0,INK,1);T(395,y+10,9,kz(Math.max(0,m.alvo-g)),0,INK,1);T(405,y+10,9,dBR(m.prazo));T(R-6,y+10,9,p+'%',1,BR,1);
    B(M,y+16,R-M,4,'0.88 0.92 0.90');if(p>0)B(M,y+16,(R-M)*Math.min(p,100)/100,4,BR);y+=30;
  });
  const dl=metas.flatMap(m=>m.dep.map(d=>({d:d.d,v:d.v,id:d.id,n:m.nome}))).sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id).slice(0,15);
  if(y+60>H-70){nova();y=50}
  y+=8;T(M,y,13,'Últimos depósitos',1,BR);y+=12;
  B(M,y,R-M,20,'0.90 0.94 0.92');T(M+6,y+13,8,'DATA',1,GR);T(120,y+13,8,'META',1,GR);T(R-6,y+13,8,'VALOR',1,GR,1);y+=26;
  if(!dl.length){T(M+6,y+12,10,'Nenhum depósito registado.',0,GR);y+=24}
  dl.forEach(d=>{if(y+22>H-70){nova();y=50}T(M+6,y+10,9,dBR(d.d));T(120,y+10,9,cut(d.n,40));T(R-6,y+10,9,'+ '+kz(d.v),1,BR,1);B(M,y+16,R-M,.6,'0.88 0.92 0.90');y+=21});
  pages.forEach((p,i)=>{P=p;B(M,H-52,R-M,.8,'0.80 0.86 0.83');T(M,H-34,7.5,'Meta 100K · Autor: Gabriel Pedro Da Conceição · gabrielpe3109@gmail.com',0,GR);T(R,H-34,7.5,'Página '+(i+1)+' de '+pages.length,0,GR,1)});
  let out='%PDF-1.4\n';const offs=[];
  const add=s=>{offs.push(out.length);out+=offs.length+' 0 obj\n'+s+'\nendobj\n'};
  add('<< /Type /Catalog /Pages 2 0 R >>');
  add('<< /Type /Pages /Kids ['+pages.map((_,i)=>(5+2*i)+' 0 R').join(' ')+'] /Count '+pages.length+' >>');
  add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
  pages.forEach((p,i)=>{const c=p.join('\n');
    add('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents '+(6+2*i)+' 0 R >>');
    add('<< /Length '+c.length+' >>\nstream\n'+c+'\nendstream')});
  const xr=out.length;
  out+='xref\n0 '+(offs.length+1)+'\n0000000000 65535 f \n'+offs.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+'trailer\n<< /Size '+(offs.length+1)+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF';
  return Uint8Array.from(out,c=>c.charCodeAt(0)&255);
}
function pdfBlob(){return {blob:new Blob([criarPDF()],{type:'application/pdf'}),nome:'Relatorio-Meta100K-'+hoje()+'.pdf'}}
function baixarPDF(){
  try{const p=pdfBlob(),u=URL.createObjectURL(p.blob),a=document.createElement('a');
    a.href=u;a.download=p.nome;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);
    modal({tipo:'sucesso',titulo:'PDF gerado',texto:'O download começou. Se não aparecer, use "Compartilhar PDF" ou abra o app no Chrome.'})}
  catch(e){modal({tipo:'erro',titulo:'Falha ao gerar o PDF',texto:'Tente novamente.'})}
}
async function compartilharPDF(){
  try{const p=pdfBlob(),f=new File([p.blob],p.nome,{type:'application/pdf'});await navigator.share({files:[f],title:'Relatório Meta 100K'})}
  catch(e){if(e&&e.name!=='AbortError')modal({tipo:'erro',titulo:'Não foi possível compartilhar',texto:'Use o botão Baixar PDF.'})}
}

function intro(){
  const o=document.getElementById('intro');if(!o)return;
  let visto=null;try{visto=sessionStorage.getItem('iv')}catch(e){}
  if(visto||matchMedia('(prefers-reduced-motion: reduce)').matches){o.remove();return}
  try{sessionStorage.setItem('iv','1')}catch(e){}
  const c=document.getElementById('icont'),t0=performance.now()+1200;
  (function f(t){const p=Math.min(1,Math.max(0,(t-t0)/2000));c.textContent=kz(100000*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(performance.now());
  const fim=()=>{o.classList.add('sai');setTimeout(()=>o.remove(),550)};
  o.onclick=fim;setTimeout(fim,4200);
}

if('serviceWorker' in navigator){
  let clicou=false,rec=false;
  navigator.serviceWorker.register('sw.js').then(reg=>{
    const pronto=w=>{document.getElementById('aviso').style.display='flex';document.getElementById('atualizar').onclick=()=>{clicou=true;w.postMessage('ativar')}};
    if(reg.waiting&&navigator.serviceWorker.controller)pronto(reg.waiting);
    reg.addEventListener('updatefound',()=>{const n=reg.installing;n.addEventListener('statechange',()=>{if(n.state==='installed'&&navigator.serviceWorker.controller)pronto(n)})});
    setInterval(()=>reg.update().catch(()=>{}),60000);
  }).catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(rec||!clicou)return;rec=true;location.reload()});
}
