const b64=b=>btoa(String.fromCharCode.apply(null,new Uint8Array(b)));
const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function pinHash(pin,salt){
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);
  return b64(await crypto.subtle.deriveBits({name:'PBKDF2',salt:salt,iterations:150000,hash:'SHA-256'},k,256));
}
let bloqueado=false,escondido=0;
function telaPin(modo,fim){
  const ov=el('div');ov.id='pin';let dig='',passo=1,primeiro='',ocupado=false;
  const h=el('h2'),p=el('p'),dots=el('div','dots'),kp=el('div','kp');
  for(let i=0;i<6;i++)dots.append(el('i'));
  const T={definir:['Criar PIN','Escolha 6 números'],desbloquear:['Digite o PIN','Para abrir o Meta 100K'],confirmar:['Confirme o PIN','Digite o PIN atual']};
  h.textContent=T[modo][0];p.textContent=T[modo][1];
  const desenha=()=>[...dots.children].forEach((d,i)=>{d.className=i<dig.length?'f':''});
  const erro=t=>{p.textContent=t;dots.classList.add('shake');setTimeout(()=>dots.classList.remove('shake'),400);dig='';desenha();ocupado=false};
  const ok=()=>{ov.remove();fim(true)};
  async function conclui(){
    ocupado=true;
    if(modo==='definir'){
      if(passo===1){primeiro=dig;passo=2;dig='';desenha();h.textContent='Repita o PIN';p.textContent='Digite de novo para confirmar';ocupado=false;return}
      if(dig!==primeiro){passo=1;primeiro='';erro('Os PINs não coincidem. Comece de novo.');h.textContent='Criar PIN';return}
      const salt=crypto.getRandomValues(new Uint8Array(16));cfg.pin={s:b64(salt),h:await pinHash(dig,salt)};cfg.pinf=null;salvarCfg();ok();return;
    }
    const f=cfg.pinf||{n:0,ate:0};
    if(Date.now()<f.ate){erro('Aguarde '+Math.ceil((f.ate-Date.now())/1000)+'s para tentar de novo.');return}
    if(await pinHash(dig,ub64(cfg.pin.s))===cfg.pin.h){cfg.pinf=null;salvarCfg();ok();return}
    f.n++;if(f.n>=5)f.ate=Date.now()+Math.min(900000,30000*Math.pow(2,f.n-5));cfg.pinf=f;salvarCfg();
    erro(f.n>=5?'PIN incorreto. Bloqueado por '+Math.ceil((f.ate-Date.now())/1000)+'s.':'PIN incorreto. Restam '+(5-f.n)+' tentativas.');
  }
  ['1','2','3','4','5','6','7','8','9','','0','⌫'].forEach(k=>{
    const b=el('button','',k);if(!k)b.style.visibility='hidden';
    b.onclick=()=>{if(ocupado)return;if(k==='⌫')dig=dig.slice(0,-1);else if(dig.length<6)dig+=k;desenha();if(dig.length===6)conclui()};kp.append(b);
  });
  ov.append(h,p,dots,kp);
  if(modo==='desbloquear'){const e=el('button','link','Esqueci o PIN');e.onclick=()=>sair();ov.append(e)}
  else{const c=el('button','link','Cancelar');c.onclick=()=>{ov.remove();fim(false)};ov.append(c)}
  document.body.append(ov);
}

    const e=em.i.value.trim().toLowerCase();let ok=true;
    if(!EMAILRX.test(e)){em.e.textContent='Digite um e-mail válido.';ok=false}
    if(!pw.i.value){pw.e.textContent='Digite a sua senha.';ok=false}
    if(!ok)return;
    if(Date.now()<loginBloq){modal({tipo:'erro',titulo:'Muitas tentativas',texto:'Aguarde '+Math.ceil((loginBloq-Date.now())/1000)+' segundos e tente de novo.'});return}
    try{const j=await comEspera('Entrando...',()=>sb('/auth/v1/token?grant_type=password',{method:'POST',body:{email:e,password:pw.i.value},token:KEY}));falhasLogin=0;await abrirSessao(j,'Bem-vindo!')}
    catch(x){if(x&&x.status===400){falhasLogin++;if(falhasLogin>=5){loginBloq=Date.now()+60000;falhasLogin=0}}modal({tipo:'erro',titulo:'Falha ao entrar',texto:erroTxt(x)})}
  };
  const al=el('div','alt');al.append(document.createTextNode('Não tem conta? '));const l=el('button','link','Criar conta');l.type='button';l.onclick=authCadastro;al.append(l);
  c.append(b,al);
}
function authCadastro(){
  const c=authBase('Criar conta','Gestão simples para a sua empresa');
  const nm=campo(c,'Nome','text',{ac:'name',ph:'Como quer ser chamado'}),em=campo(c,'E-mail','email',{ac:'email',ph:'seu@email.com'}),pw=campo(c,'Senha','password',{ac:'new-password',ph:'Mínimo 8 caracteres'});
  medidor(c,pw.i);const cc=campo(c,'Confirmar senha','password',{ac:'new-password',ph:'Repita a senha'});
  const tm=el('label','tm'),ck=el('input');ck.type='checkbox';tm.append(ck,document.createTextNode('Li e aceito os '));
  const tl=el('button','link','termos e privacidade');tl.type='button';
  tl.onclick=ev=>{ev.preventDefault();modal({tipo:'info',fixo:1,titulo:'Termos e privacidade',ok:'Entendi',texto:'Ao criar uma conta, guardamos o seu nome, e-mail e os dados que registar (empresa, funcionários, documentos, pagamentos e contratos) para sincronizar entre aparelhos.\n\nEsses dados ficam ligados à sua conta e outros usuários do app não os veem.\n\nPode apagar os seus dados em Ajustes.'})};
  tm.append(tl);c.append(tm);const te=el('div','er');c.append(te);ck.onchange=()=>{te.textContent=''};
  const b=el('button','pri','Criar conta');
  b.onclick=async()=>{
    const n=nm.i.value.trim(),e=em.i.value.trim().toLowerCase();let ok=true;
    if(n.length<2){nm.e.textContent='Digite o seu nome.';ok=false}
    if(!EMAILRX.test(e)){em.e.textContent='Digite um e-mail válido.';ok=false}
    if(!senhaOk(pw.i.value,cc.i.value,pw,cc))ok=false;
    if(!ck.checked){te.textContent='Aceite os termos para continuar.';ok=false}
    if(!ok)return;
    try{const j=await comEspera('Criando conta...',()=>sb('/auth/v1/signup?redirect_to='+encodeURIComponent(location.origin+location.pathname),{method:'POST',body:{email:e,password:pw.i.value,data:{nome:n}},token:KEY}));
      if(j&&j.access_token)await abrirSessao(j,'Conta criada!');
      else{authEntrar();modal({tipo:'sucesso',fixo:1,titulo:'Verifique o seu e-mail',texto:'Enviámos um link para confirmar a conta. Depois é só entrar.'})}}
    catch(x){modal({tipo:'erro',titulo:'Falha ao criar conta',texto:erroTxt(x)})}
  };
  const al=el('div','alt');al.append(document.createTextNode('Já tem conta? '));const l=el('button','link','Entrar');l.type='button';l.onclick=authEntrar;al.append(l);
  c.append(b,al);
}
function authRecuperar(){
  const c=authBase('Recuperar senha','Enviaremos um código para o seu e-mail');
  const em=campo(c,'E-mail da conta','email',{ac:'email',ph:'seu@email.com'});
  const b=el('button','pri','Enviar código');
  b.onclick=async()=>{
    const e=em.i.value.trim().toLowerCase();
    if(!EMAILRX.test(e)){em.e.textContent='Digite um e-mail válido.';return}
    try{await comEspera('Enviando código...',()=>sb('/auth/v1/recover',{method:'POST',body:{email:e},token:KEY}));authCodigo(e);
      modal({tipo:'sucesso',titulo:'Código enviado',texto:'Se existir uma conta com este e-mail, o código chega em instantes. Veja também o spam.'})}
    catch(x){modal({tipo:'erro',titulo:'Falha ao enviar',texto:erroTxt(x)})}
  };
  const v=el('button','sec','Voltar');v.onclick=authEntrar;c.append(b,v);
}
function authCodigo(email){
  const c=authBase('Nova senha','Digite o código recebido e escolha a nova senha');
  const cd=campo(c,'Código do e-mail','text',{ac:'one-time-code',ph:'Código',im:'numeric',max:8}),pw=campo(c,'Nova senha','password',{ac:'new-password',ph:'Mínimo 8 caracteres'});
  medidor(c,pw.i);const cc=campo(c,'Confirmar nova senha','password',{ac:'new-password',ph:'Repita a senha'});
  const b=el('button','pri','Redefinir senha');
  b.onclick=async()=>{
    const t=cd.i.value.trim();let ok=true;
    if(t.length<6){cd.e.textContent='Digite o código recebido.';ok=false}
    if(!senhaOk(pw.i.value,cc.i.value,pw,cc))ok=false;
    if(!ok)return;
    try{const j=await comEspera('Redefinindo senha...',async()=>{const s=await sb('/auth/v1/verify',{method:'POST',body:{type:'recovery',email:email,token:t},token:KEY});
        await sb('/auth/v1/user',{method:'PUT',body:{password:pw.i.value},token:s.access_token});return s});
      await abrirSessao(j,'Senha redefinida!')}
    catch(x){modal({tipo:'erro',titulo:'Falha ao redefinir',texto:erroTxt(x)})}
  };
  const r=el('button','link','Reenviar código');r.type='button';r.style.marginTop='12px';
  r.onclick=async()=>{try{await comEspera('Enviando código...',()=>sb('/auth/v1/recover',{method:'POST',body:{email:email},token:KEY}));modal({tipo:'sucesso',titulo:'Código reenviado'})}catch(x){modal({tipo:'erro',titulo:'Falha ao enviar',texto:erroTxt(x)})}};
  const v=el('button','sec','Voltar');v.onclick=authEntrar;c.append(b,r,v);
}
function authNovaSenha(token){
  const c=authBase('Nova senha','Escolha uma senha segura');
  const pw=campo(c,'Nova senha','password',{ac:'new-password',ph:'Mínimo 8 caracteres'});medidor(c,pw.i);
  const cc=campo(c,'Confirmar nova senha','password',{ac:'new-password',ph:'Repita a senha'});
  const b=el('button','pri','Guardar nova senha');
  b.onclick=async()=>{
    if(!senhaOk(pw.i.value,cc.i.value,pw,cc))return;
    try{await comEspera('Guardando...',()=>sb('/auth/v1/user',{method:'PUT',body:{password:pw.i.value},token:token}));authEntrar();modal({tipo:'sucesso',titulo:'Senha alterada',texto:'Entre com a nova senha.'})}
    catch(x){modal({tipo:'erro',titulo:'Falha ao alterar',texto:erroTxt(x)})}
  };
  c.append(b);
}

function iniciar(){
  aplicarTema();
  const h=new URLSearchParams(location.hash.replace(/^#/,''));
  if(h.get('type')==='recovery'&&h.get('access_token')){const t=h.get('access_token');try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}document.body.classList.add('deslogado');authNovaSenha(t);return}
  const er=h.get('error_description')||h.get('error'),tp=h.get('type');
  if(er||(tp&&tp!=='recovery')){try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
    if(!sess){document.body.classList.add('deslogado');authEntrar();
      if(er)modal({tipo:'erro',titulo:'Link inválido ou expirado',texto:'Peça um novo e-mail de confirmação ou entre com a sua conta.'});
      else modal({tipo:'sucesso',fixo:1,titulo:'E-mail confirmado!',texto:'A sua conta está pronta. Entre com o e-mail e a senha.'});
      return}}
  if(sess){document.body.classList.remove('deslogado');entrarApp();exigirPin()}
  else{document.body.classList.add('deslogado');authEntrar()}
}
addEventListener('online',()=>{if(sess)setTimeout(sincronizar,800)});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&sess)sincronizar()});
iniciar();
if('serviceWorker' in navigator){
  let clicou=false,rec=false;
  navigator.serviceWorker.register('sw.js').then(reg=>{
    const pronto=w=>{$('aviso').style.display='flex';$('atualizar').onclick=()=>{clicou=true;w.postMessage('ativar')}};
    if(reg.waiting&&navigator.serviceWorker.controller)pronto(reg.waiting);
    reg.addEventListener('updatefound',()=>{const n=reg.installing;n.addEventListener('statechange',()=>{if(n.state==='installed'&&navigator.serviceWorker.controller)pronto(n)})});
    setInterval(()=>reg.update().catch(()=>{}),60000);
  }).catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(rec||!clicou)return;rec=true;location.reload()});
}
